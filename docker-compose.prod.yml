name: campusmart-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in the root .env file}
      CMU_OAUTH_CLIENT_ID: ${CMU_OAUTH_CLIENT_ID:?Set CMU_OAUTH_CLIENT_ID in the root .env file}
      CMU_OAUTH_CLIENT_SECRET: ${CMU_OAUTH_CLIENT_SECRET:?Set CMU_OAUTH_CLIENT_SECRET in the root .env file}
      CMU_OAUTH_REDIRECT_URI: ${CMU_OAUTH_REDIRECT_URI:?Set CMU_OAUTH_REDIRECT_URI in the root .env file}
      ENABLE_MOCK_AUTH: "false"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CAMPUSMART_WEB_PORT:?Set CAMPUSMART_WEB_PORT in the root .env file}:80"

volumes:
  postgres_data:
    name: campusmart-prod-postgres-data
  uploads:
    name: campusmart-prod-uploads
