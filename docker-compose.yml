services:
  postgres:
    image: postgres:16-alpine
    container_name: campusmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusmart-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/campusmart?schema=public
      JWT_SECRET: supersecret_cmu_campusmart_jwt_key_2026_dev
      FRONTEND_URL: http://localhost
      CMU_OAUTH_CLIENT_ID: ${CMU_OAUTH_CLIENT_ID:-mock_cmu_client_id}
      CMU_OAUTH_CLIENT_SECRET: ${CMU_OAUTH_CLIENT_SECRET:-mock_cmu_client_secret}
      CMU_OAUTH_REDIRECT_URI: http://localhost:5000/api/auth/cmu/callback
      ENABLE_MOCK_AUTH: "true"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusmart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
